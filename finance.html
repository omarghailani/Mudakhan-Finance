<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mudakhan Finance">
<meta name="theme-color" content="#460e1e">
<title>Mudakhan · Finance</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-finance.png">
<link rel="icon" type="image/png" href="icon-finance.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --maroon:#460e1e; --maroon-2:#5f1a2e; --sand:#c9b49f; --sand-soft:#ded2c1;
    --bg:#F4EEE4; --card:#FFFFFF; --ink:#2A1017; --muted:#8A7768; --line:#E8DDCD;
    --red:#C0392B; --red-bg:#F8E6E3; --red-ink:#8A2B22;
    --green:#3E8E4F; --green-bg:#E4EFE1; --green-ink:#2A6136;
    --amber:#B9820A; --amber-bg:#F7EBCB;
    --shadow:0 1px 2px rgba(42,16,23,.05),0 6px 18px rgba(42,16,23,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding-bottom:40px;}

  header{background:var(--maroon);color:var(--sand);padding:18px 18px 16px;position:sticky;top:0;z-index:20;
    border-bottom:3px solid var(--sand);display:flex;align-items:center;gap:12px;}
  header img{height:38px;}
  header .t{font-family:'Cairo';font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.9;}
  .back{margin-inline-start:auto;background:rgba(201,180,159,.16);border:1px solid rgba(201,180,159,.3);
    color:var(--sand);border-radius:11px;padding:7px 14px;font-family:'Cairo';font-weight:700;font-size:13px;cursor:pointer;}

  main{padding:18px 16px;}
  h1{font-family:'Cairo';font-weight:800;font-size:22px;margin:2px 0 4px;color:var(--ink);}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px;}

  /* role picker */
  .role{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;
    display:flex;align-items:center;gap:16px;}
  .role:active{transform:scale(.98);}
  .role .ic{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:var(--maroon);color:var(--sand);
    display:grid;place-items:center;}
  .role .txt b{font-family:'Cairo';font-weight:700;font-size:17px;display:block;color:var(--ink);}
  .role .txt span{color:var(--muted);font-size:13px;}

  /* entry */
  .amount-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
    box-shadow:var(--shadow);margin-bottom:16px;text-align:center;}
  .amount-box label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
  .amount-input{width:100%;border:none;font-family:'Cairo';font-weight:800;font-size:46px;text-align:center;
    color:var(--maroon);background:transparent;margin-top:8px;}
  .amount-input:focus{outline:none;}
  .amount-box .omr{color:var(--muted);font-size:14px;font-weight:700;}

  .lbl{font-size:13px;font-weight:700;color:var(--muted);margin:4px 2px 9px;text-transform:uppercase;letter-spacing:.08em;}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .cat{padding:15px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);
    font-family:'Cairo';font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;transition:.15s;}
  .cat:active{transform:scale(.97);}
  .cat.on{background:var(--maroon);color:var(--sand);border-color:var(--maroon);}

  .in-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    margin-bottom:11px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
  .in-row label{flex:1;font-family:'Cairo';font-weight:700;font-size:16px;}
  .in-row input{width:130px;border:1px solid var(--line);border-radius:11px;padding:12px;font-family:'Cairo';
    font-weight:700;font-size:20px;text-align:right;color:var(--maroon);}
  .in-row input:focus{outline:2px solid var(--maroon);outline-offset:-1px;}

  .note-in{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font-family:inherit;
    font-size:15px;background:var(--card);margin-bottom:16px;}
  .note-in:focus{outline:2px solid var(--maroon);outline-offset:-1px;}

  .save{width:100%;padding:17px;border-radius:15px;border:none;background:var(--maroon);color:var(--sand);
    font-family:'Cairo';font-weight:800;font-size:17px;cursor:pointer;}
  .save:disabled{opacity:.6;}
  .save:active{transform:scale(.99);}

  /* dashboard */
  .period-tabs{display:flex;gap:7px;margin-bottom:16px;}
  .pt{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    font-family:'Cairo';font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;}
  .pt.on{background:var(--maroon);color:var(--sand);border-color:var(--maroon);}
  .hero{background:var(--maroon);color:var(--sand);border-radius:18px;padding:20px;margin-bottom:14px;}
  .hero .big{font-family:'Cairo';font-weight:800;font-size:40px;line-height:1;}
  .hero .cap{font-size:13px;color:var(--sand-soft);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:6px;}
  .hero .sm{font-size:13px;color:var(--sand-soft);margin-top:8px;}
  .two{display:flex;gap:12px;margin-bottom:14px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
  .stat .cap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
  .stat .v{font-family:'Cairo';font-weight:800;font-size:24px;margin-top:5px;}
  .stat.pos .v{color:var(--green-ink);} .stat.neg .v{color:var(--red-ink);}
  .ratio{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .ratio .cap{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .ratio .v{font-family:'Cairo';font-weight:800;font-size:32px;margin:4px 0;color:var(--maroon);}
  .ratio .bar{height:10px;border-radius:6px;background:#ECE4D8;overflow:hidden;margin-top:8px;position:relative;}
  .ratio .bar i{display:block;height:100%;background:var(--maroon);}
  .ratio .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--green);}
  .ratio .hint{font-size:12px;color:var(--muted);margin-top:8px;}

  .sec-h{font-family:'Cairo';font-weight:700;font-size:15px;margin:18px 2px 10px;color:var(--ink);}
  .catrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:8px;
    display:flex;align-items:center;box-shadow:var(--shadow);}
  .catrow .n{flex:1;font-weight:700;}
  .catrow .a{font-family:'Cairo';font-weight:800;color:var(--maroon);}
  .catrow .pct{font-size:12px;color:var(--muted);width:48px;text-align:right;margin-inline-start:10px;}

  .loader{text-align:center;padding:50px;color:var(--muted);}
  .spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--maroon);border-radius:50%;
    animation:spin 1s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:60;
    transition:.25s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--red);}
  .hidden{display:none;}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastTimer;
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.classList.toggle('err',!!e);t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

// ---------- write via Worker ----------
function buildUrl(p){const all=Object.assign({},p,{token:TOKEN,_:Date.now()});return WORKER_URL+'?'+Object.keys(all).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(all[k]==null?'':all[k])).join('&');}
async function apiWrite(p){
  try{
    const r=await fetch(buildUrl(p),{cache:'no-store'});
    const txt=(await r.text()).trim();
    try{
      const j=JSON.parse(txt);
      if(j&&j.ok) return j;
      if(j&&j.error) throw new Error(j.error);
      return j||{ok:true};
    }catch(parseErr){
      if(parseErr instanceof Error && parseErr.message && !/JSON|Unexpected|token/i.test(parseErr.message)) throw parseErr;
      if(txt && !/error|denied|unauthor|<html|login|sign in|not found|يتعذر/i.test(txt)) return {ok:true,raw:txt};
      throw new Error('bad reply');
    }
  }catch(e){
    // Reply channel hiccup — the write often still landed. Retry once, blind.
    try{
      const im=new Image(); im.src=buildUrl(p);           // fire-and-forget resend
    }catch(_){}
    throw e;   // caller decides whether to verify
  }
}

// Read a tab and return rows (used for verifying a save actually landed)
function verifyRows(gid){
  return new Promise((resolve,reject)=>{
    const cb='vrf_'+Date.now()+'_'+Math.floor(Math.random()*1e5);
    const s=document.createElement('script');let done=false;
    function clean(){try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.remove();}
    const t=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('vt'));},10000);
    window[cb]=function(resp){if(done)return;done=true;clearTimeout(t);clean();
      try{const tb=resp.table;const rows=tb.rows.map(r=>(r.c||[]).map(c=>c?c.v:null));resolve(rows);}catch(e){reject(e);}};
    s.onerror=()=>{if(done)return;done=true;clearTimeout(t);clean();reject(new Error('vn'));};
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&gid=${gid}&_=${Date.now()}`;
    document.body.appendChild(s);
  });
}

// ---------- read sheet via gviz ----------
function readTab(gid){
  return new Promise((resolve,reject)=>{
    const cb='fin_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5);
    const s=document.createElement('script');
    let done=false;
    function clean(){try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.remove();}
    const timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('timeout'));},12000);
    window[cb]=function(resp){
      if(done)return;done=true;clearTimeout(timer);clean();
      try{
        const t=resp.table;
        const labels=t.cols.map((c,i)=>(c.label&&c.label.trim())?c.label.trim():(c.id||('c'+i)));
        const rows=t.rows.map(r=>{const o={};(r.c||[]).forEach((cell,i)=>{o[labels[i]]=cell?cell.v:null;});return o;});
        resolve(rows);
      }catch(e){reject(e);}
    };
    s.onerror=()=>{if(done)return;done=true;clearTimeout(timer);clean();reject(new Error('net'));};
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&gid=${gid}&_=${Date.now()}`;
    document.body.appendChild(s);
  });
}
function num(v){ if(v==null||v==='') return 0; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function parseDate(v){
  if(v==null) return null;
  if(v instanceof Date) return v;
  const s=String(v);
  // gviz sometimes returns Date(y,m,d)
  let m=s.match(/Date\((\d+),(\d+),(\d+)/);
  if(m) return new Date(+m[1],+m[2],+m[3]);
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s); return isNaN(d)?null:d;
}

  const d=new Date();
  if(incomeDay==='yesterday') d.setDate(d.getDate()-1);
  const payload={action:'addIncome', date:ddmmyyyy(d)};
  // only send fields that were actually typed → server merges, blanks untouched
  if(cashV!=='')     payload.cash=parseFloat(cashV)||0;
  if(transferV!=='') payload.transfer=parseFloat(transferV)||0;
  if(deliveryV!=='') payload.delivery=parseFloat(deliveryV)||0;
  if(cardV!=='')     payload.card=parseFloat(cardV)||0;
  const dayLabel=(incomeDay==='today'?'today':'yesterday');
  // optimistic: confirm instantly, clear fields, write in background
  toast('Saved ✓ ('+dayLabel+')');
  ['inCash','inTransfer','inDelivery','inCard'].forEach(id=>document.getElementById(id).value='');
  (async()=>{
    try{ await apiWrite(payload); }
    catch(e){
      try{
        await new Promise(r=>setTimeout(r,1500));
        const rows=await verifyRows(GID.income);
        const hit=rows.some(r=>{
          const rd=r[0]; if(rd==null) return false;
          let ds=String(rd); const m=ds.match(/Date\((\d+),(\d+),(\d+)/);
          if(m) ds=(+m[3])+'/'+((+m[2])+1)+'/'+m[1];
          return ds===payload.date;
        });
        if(!hit) toast('⚠ '+dayLabel+' income may not have saved — check sheet',true);
      }catch(_){ toast('⚠ '+dayLabel+' income may not have saved — check sheet',true); }
    }
  })();
}

async function renderDash(main){
  main.innerHTML=`<div class="loader"><div class="spinner"></div>Reading your numbers…</div>`;
  try{
    const [inc,exp,fix,rec]=await Promise.all([readTab(GID.income),readTab(GID.expenses),readTab(GID.fixed),readTab(GID.recurring)]);
    DATA.income=inc; DATA.expenses=exp; DATA.fixed=fix; DATA.recurring=rec;
    drawDash(main);
  }catch(e){
    main.innerHTML=`<div class="loader">Couldn't read the sheet.<br>Make sure it's shared as <b>Anyone with the link · Viewer</b>.<br><br><button class="save" style="max-width:200px;margin:0 auto" onclick="renderDash(document.getElementById('main'))">Try again</button></div>`;
  }
}
function inPeriod(d,p){
  if(!d||isNaN(d)) return false;
  const now=new Date();
  if(p==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  if(p==='prev'){
    const pm=new Date(now.getFullYear(), now.getMonth()-1, 1);
    return d.getMonth()===pm.getMonth() && d.getFullYear()===pm.getFullYear();
  }
  if(p==='week'){ const diff=(now-d)/86400000; return diff>=0 && diff<7; }
  return true; // all
}
// months elapsed within the selected period (for spreading fixed/recurring costs)
function monthsInPeriod(p, incRows, expRows){
  if(p==='month'||p==='prev') return 1;
  if(p==='week') return 7/30;
  const months={};
  incRows.concat(expRows).forEach(r=>{if(r.d&&!isNaN(r.d))months[r.d.getFullYear()+'-'+r.d.getMonth()]=1;});
  return Math.max(1,Object.keys(months).length);
}
function drawDash(main){
  // parse income rows: columns Date, Cash, Transfer, Delivery, Card (+ maybe Total)
  const incRows=DATA.income.map(r=>{const vals=Object.values(r);return {d:parseDate(vals[0]), cash:num(vals[1]),transfer:num(vals[2]),delivery:num(vals[3]),card:num(vals[4])};});
  const expRows=DATA.expenses.map(r=>{const vals=Object.values(r);return {d:parseDate(vals[0]), amt:num(vals[1]), cat:String(vals[2]||'').trim()};});

  const fInc=incRows.filter(r=>inPeriod(r.d,period));
  const fExp=expRows.filter(r=>inPeriod(r.d,period));

  const income=fInc.reduce((s,r)=>s+r.cash+r.transfer+r.delivery+r.card,0);
  const variable=fExp.reduce((s,r)=>s+r.amt,0);
  const stock=fExp.filter(r=>/stock/i.test(r.cat)).reduce((s,r)=>s+r.amt,0);

  // fixed: scan rows for numeric monthly amounts (tab has a title row, so read defensively)
  const fixedMonthly=DATA.fixed.reduce((s,r)=>{
    const v=Object.values(r);
    const label=String(v[0]||'').toLowerCase();
    const amt=num(v[1]);
    if(amt>0 && !/total|monthly|category|fixed cost/.test(label)) return s+amt;
    return s;
  },0);
  const recMonthly=DATA.recurring.reduce((s,r)=>{const v=Object.values(r);const mc=num(v[3]); if(mc>0) return s+mc; const tot=num(v[1]),every=num(v[2])||1; return s+(tot/every);},0);

  const nMonths=monthsInPeriod(period, incRows, expRows);
  // Spread fixed+recurring by real days. Each month divides by its own day count.
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  const now=new Date();
  let fixedForPeriod;
  if(period==='month'){
    const dim=daysInMonth(now.getFullYear(), now.getMonth());
    const elapsed=now.getDate();
    fixedForPeriod=(fixedMonthly+recMonthly)/dim*elapsed;
  } else if(period==='prev'){
    fixedForPeriod=(fixedMonthly+recMonthly);
  } else if(period==='week'){
    const dim=daysInMonth(now.getFullYear(), now.getMonth());
    fixedForPeriod=(fixedMonthly+recMonthly)/dim*7;
  } else {
    fixedForPeriod=(fixedMonthly+recMonthly)*nMonths;
  }

  const bottom=income-variable-fixedForPeriod;
  const stockPct=income>0?(stock/income*100):0;

  const pl=v=>v.toFixed(3);
  const periodLabel={month:'This month',prev:'Previous month',week:'This week',all:'All time'}[period];

  // category breakdown
  const catTot={};
  fExp.forEach(r=>{const k=r.cat||'Uncategorised';catTot[k]=(catTot[k]||0)+r.amt;});
  const catList=Object.entries(catTot).sort((a,b)=>b[1]-a[1]);

  main.innerHTML=`
    <h1>Dashboard</h1>
    <div class="period-tabs" style="flex-wrap:wrap">
      <button class="pt ${period==='month'?'on':''}" onclick="period='month';drawDash(document.getElementById('main'))">This month</button>
      <button class="pt ${period==='prev'?'on':''}" onclick="period='prev';drawDash(document.getElementById('main'))">Last month</button>
      <button class="pt ${period==='week'?'on':''}" onclick="period='week';drawDash(document.getElementById('main'))">This week</button>
      <button class="pt ${period==='all'?'on':''}" onclick="period='all';drawDash(document.getElementById('main'))">All time</button>
    </div>

    <div class="hero">
      <div class="cap">${periodLabel} · bottom line</div>
      <div class="big">${bottom>=0?'+':''}${pl(bottom)}</div>
      <div class="sm">Income ${pl(income)} − expenses ${pl(variable)} − fixed ${pl(fixedForPeriod)}${period==='month'?` (${now.getDate()} of ${daysInMonth(now.getFullYear(),now.getMonth())} days)`:''}</div>
    </div>

    <div class="two">
      <div class="stat pos"><div class="cap">Income</div><div class="v">${pl(income)}</div></div>
      <div class="stat neg"><div class="cap">Spend</div><div class="v">${pl(variable+fixedForPeriod)}</div></div>
    </div>

    <div class="ratio">
      <div class="cap">Stock as % of income</div>
      <div class="v">${stockPct.toFixed(1)}%</div>
      <div class="bar"><i style="width:${Math.min(100,stockPct)}%"></i><span class="mark" style="left:33%"></span></div>
      <div class="hint">Green line = 33% healthy target. Stock ${pl(stock)} of ${pl(income)} income.</div>
    </div>

    <div class="sec-h">Income breakdown</div>
    <div class="catrow"><span class="n">Cash</span><span class="a">${pl(fInc.reduce((s,r)=>s+r.cash,0))}</span></div>
    <div class="catrow"><span class="n">Transfer</span><span class="a">${pl(fInc.reduce((s,r)=>s+r.transfer,0))}</span></div>
    <div class="catrow"><span class="n">Delivery</span><span class="a">${pl(fInc.reduce((s,r)=>s+r.delivery,0))}</span></div>
    <div class="catrow"><span class="n">Card</span><span class="a">${pl(fInc.reduce((s,r)=>s+r.card,0))}</span></div>

    <div class="sec-h">Expense breakdown</div>
    ${catList.length?catList.map(([c,a])=>`<div class="catrow"><span class="n">${esc(c)}</span><span class="a">${pl(a)}</span><span class="pct">${variable>0?(a/variable*100).toFixed(0):0}%</span></div>`).join(''):'<div class="foot">No expenses in this period.</div>'}
    <div class="catrow" style="border:1.5px solid var(--maroon)"><span class="n">Fixed + recurring</span><span class="a">${pl(fixedForPeriod)}</span></div>

    <div class="foot">Live from your finance sheet · ${periodLabel.toLowerCase()}</div>`;
}

render();
</script>
</body>
</html>
